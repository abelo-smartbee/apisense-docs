<!--
  ANIMATED Scale mounting instruction (browser-only preview / design source).
  Scenario: 1) the user scans the SCALE's QR code with the Apisense app (close-up scene),
  2) the scale (two angle profiles with the electronics box at the front end) slides in under
  the RIGHT legs of the hive, 3) a wooden beam (kantowka) slides in under the LEFT legs to
  level the hive, 4) confirmation check. All frames stay seated - nothing else moves.

  DO NOT bundle as a Flutter asset: flutter_svg throws on style elements and supports no
  CSS/SMIL animation. Base scene: hive_frames_illustration_animated.svg. Siblings:
  montaz-systemu-animated.svg, montaz-hub-animated.svg, montaz-sensora-animated.svg.

  Timing (14s loop): 5-42% QR scan (sweep 10-22%, phone check 26-30%), 50-56% scale slides in
  under the right legs, 58-64% beam under the left legs, 72-90% confirmation check,
  92-100% fade for a clean wrap.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 165" stroke-linecap="round" stroke-linejoin="round">
  <title>Montaż wagi Apisense (Scale): skan QR aplikacją, waga pod prawymi nogami ula, kantówka pod lewymi</title>
  <style>
    /* 14s LOOP: Scale QR scan (close-up + phone) -> the scale slides in under the RIGHT legs
       of the hive -> a wooden beam (kantowka) slides in under the LEFT legs -> check.
       Frames never move. */
    .scale-scene { animation: scaleScene 14s ease-in-out infinite; }
    @keyframes scaleScene {
      0%, 2%    { opacity: 0; }
      5%, 42%   { opacity: 1; }
      48%, 100% { opacity: 0; }
    }
    .scale-phone { animation: scalePhoneIn 14s ease-in-out infinite; }
    @keyframes scalePhoneIn {
      0%, 3%   { transform: translateX(14px); opacity: 0; }
      8%, 100% { transform: translateX(0); opacity: 1; }
    }
    .scale-scan-line { animation: scaleScanSweep 14s ease-in-out infinite; }
    @keyframes scaleScanSweep {
      0%, 10%   { transform: translateY(0); }
      13%       { transform: translateY(22px); }
      16%       { transform: translateY(0); }
      19%       { transform: translateY(22px); }
      22%, 100% { transform: translateY(0); }
    }
    .scale-scan-ok { transform-box: fill-box; transform-origin: center;
                     animation: scaleScanOk 14s ease-in-out infinite; }
    @keyframes scaleScanOk {
      0%, 26%   { transform: scale(0.4); opacity: 0; }
      30%, 100% { transform: scale(1); opacity: 1; }
    }
    .scale-placed { animation: scalePlaced 14s ease-in-out infinite; }
    @keyframes scalePlaced {
      0%, 50%   { transform: translateX(14px); opacity: 0; }
      56%, 92%  { transform: translateX(0); opacity: 1; }
      97%, 100% { transform: translateX(0); opacity: 0; }
    }
    .beam-placed { animation: beamPlaced 14s ease-in-out infinite; }
    @keyframes beamPlaced {
      0%, 58%   { transform: translateX(-10px); opacity: 0; }
      64%, 92%  { transform: translateX(0); opacity: 1; }
      97%, 100% { transform: translateX(0); opacity: 0; }
    }
    .check { transform-box: fill-box; transform-origin: center;
             animation: pop 14s ease-in-out infinite; }
    @keyframes pop {
      0%, 68%   { transform: scale(0.4); opacity: 0; }
      72%, 90%  { transform: scale(1); opacity: 1; }
      96%, 100% { transform: scale(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scale-scene, .scale-phone, .scale-scan-line, .scale-scan-ok,
      .scale-placed, .beam-placed, .check { animation: none; }
      .scale-scene { opacity: 0; }
      .check { opacity: 1; }
    }
  </style>

  <!-- Top opening + slot guide lines (under the frames) -->
  <path d="M48.9 98.3 L115.4 98.3 L151.1 80.45 L84.6 80.45 Z" fill="#F1E6CC" stroke="#E2C687" stroke-width="1.2"/>
  <line x1="52.25" y1="96.6" x2="118.75" y2="96.6" stroke="#E2C687" stroke-width="1"/>
  <line x1="66.75" y1="89.38" x2="133.25" y2="89.38" stroke="#E2C687" stroke-width="1"/>
  <line x1="81.25" y1="82.15" x2="147.75" y2="82.15" stroke="#E2C687" stroke-width="1"/>
  <line x1="59.5" y1="92.99" x2="126" y2="92.99" stroke="#E2C687" stroke-width="1"/>
  <line x1="74" y1="85.76" x2="140.5" y2="85.76" stroke="#E2C687" stroke-width="1"/>

  <!-- Rim parts BEHIND all frames: left rail, back band, far end of the right rail -->
  <path d="M40 100 L48.9 98.3 L84.6 80.45 L82.5 78.75 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>
  <path d="M82.5 78.75 L84.6 80.45 L151.1 80.45 L160 78.75 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>
  <path d="M145 83.5 L145 86.25 L160 78.75 L151.1 80.45 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Back frame (gray, outer) -->
  <g transform="translate(0 33)" stroke="#A8A29E">
    <path d="M145.75 46 L149.75 44 L149.75 50 L145.75 52 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M83.25 46 L87.25 44 L149.75 44" fill="none" stroke-width="1.2"/>
    <rect x="78.25" y="48" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="145.75" y="47" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="83.25" y="46" width="62.5" height="36.5" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="87.25" y="50" width="54.5" height="28.5" rx="1.25" fill="none" stroke-width="1"/>
    <g stroke-width="1" fill="none">
      <path transform="translate(106.5 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(113.75 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(121 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(110 64.75)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(117.25 64.75)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
    </g>
  </g>

  <!-- Right rail in front of the back slot (over back frame, under back-mid) -->
  <path d="M138 87 L138 89.75 L145 86.25 L145 83.5 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Back filler frame - stays seated in its slot (only outer + central slide out) -->
  <g transform="translate(0 38.6)" stroke="#E2C687">
    <path d="M138.5 44 L142.5 42 L142.5 48 L138.5 50 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M76 44 L80 42 L142.5 42" fill="none" stroke-width="1.2"/>
    <rect x="71" y="46" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="138.5" y="45" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="76" y="44" width="62.5" height="42.2" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="80" y="48" width="54.5" height="34.2" rx="1.25" fill="none" stroke-width="1"/>
  </g>

  <!-- Right rail in front of the back-mid slot (over back-mid, under central) -->
  <path d="M130.75 90.625 L130.75 93.375 L138 89.75 L138 87 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Central frame (honey, tallest - the visual focus) -->
  <g transform="translate(0 49.5)" stroke="#D4A028">
    <path d="M131.25 36.75 L135.25 34.75 L135.25 40.75 L131.25 42.75 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M68.75 36.75 L72.75 34.75 L135.25 34.75" fill="none" stroke-width="1.2"/>
    <rect x="63.75" y="38.75" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="131.25" y="37.75" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="68.75" y="36.75" width="62.5" height="53" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="72.75" y="40.75" width="54.5" height="45" rx="1.25" fill="none" stroke-width="1"/>
    <g stroke-width="1" fill="none">
      <path transform="translate(83 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(91.75 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(100.5 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(109.25 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
    </g>
  </g>

  <!-- Right rail in front of the central slot (over central frame, under front-mid) -->
  <path d="M123.5 94.25 L123.5 97 L130.75 93.375 L130.75 90.625 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Front filler frame - stays seated in its slot (only outer + central slide out) -->
  <g transform="translate(0 36.9)" stroke="#E2C687">
    <path d="M124.0 53 L128.0 51 L128.0 57 L124.0 59 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M61.5 53 L65.5 51 L128.0 51" fill="none" stroke-width="1.2"/>
    <rect x="56.5" y="55" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="124.0" y="54" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="61.5" y="53" width="62.5" height="40.4" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="65.5" y="57" width="54.5" height="32.4" rx="1.25" fill="none" stroke-width="1"/>
  </g>

  <!-- Right rail in front of the front-mid slot (over front-mid, under front) -->
  <path d="M115.4 98.3 L117.5 100 L123.5 97 L123.5 94.25 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Front frame (gray, outer) -->
  <g transform="translate(0 33.5)" stroke="#A8A29E">
    <path d="M116.75 60 L120.75 58 L120.75 64 L116.75 66 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M54.25 60 L58.25 58 L120.75 58" fill="none" stroke-width="1.2"/>
    <rect x="49.25" y="62" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="116.75" y="61" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="54.25" y="60" width="62.5" height="37" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="58.25" y="64" width="54.5" height="29" rx="1.25" fill="none" stroke-width="1"/>
    <g stroke-width="1" fill="none">
      <path transform="translate(77.5 72.5)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(84.75 72.5)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(92 72.5)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(81 79.25)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(88.25 79.25)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
    </g>
  </g>

  <!-- Front band of the rim (over ALL frames - they retract behind it) -->
  <path d="M40 100 L117.5 100 L115.4 98.3 L48.9 98.3 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Step 2: the Scale slides in UNDER THE RIGHT LEGS, running along the hive's depth axis
       from the front-right foot to the rear-right foot; electronics box at the front end.
       Painted BEFORE the hive body so the feet stand ON it. -->
  <g class="scale-placed" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#77777C">
      <path d="M100 156.1 L104.5 156.1 L161.5 127.6 L157 127.6 Z" fill="#FFFFFF" stroke-width="1"/>
      <path d="M100 156.1 L100 160.6 L157 132.1 L157 127.6 Z" fill="#FFFFFF" stroke-width="1.1"/>
      <line x1="101.5" y1="158.6" x2="155.5" y2="131.6" stroke-width="0.7"/>
      <rect x="98.8" y="155" width="5.9" height="6.7" rx="1" fill="#FFFFFF" stroke-width="1.1"/>
      <rect x="100.3" y="156.7" width="1.4" height="1.4" fill="#77777C" stroke="none"/>
      <rect x="102.2" y="158.6" width="1.4" height="1.4" fill="#77777C" stroke="none"/>
    </g>
  </g>

  <!-- Step 3: wooden beam (kantowka) slides in UNDER THE LEFT LEGS, along the same depth
       axis - its far end disappears under the hive (the front wall occludes it). -->
  <g class="beam-placed" stroke="#D4A028" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 157.1 L51.2 157.1 L91.2 137.1 L87 137.1 Z" fill="#FFFFFF" stroke-width="1"/>
    <path d="M47 157.1 L47 161.3 L87 141.3 L87 137.1 Z" fill="#FFFFFF" stroke-width="1.1"/>
    <rect x="47" y="157.1" width="4.2" height="4.2" fill="#FFFFFF" stroke-width="1.1"/>
  </g>

  <!-- Hive body -->
  <path d="M117.5 100 L160 78.75 L160 126.25 L117.5 147.5 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.7"/>
  <line x1="117.5" y1="115.75" x2="160" y2="94.5" stroke="#E2C687" stroke-width="1"/>
  <line x1="117.5" y1="131.5" x2="160" y2="110.25" stroke="#E2C687" stroke-width="1"/>
  <rect x="40" y="100" width="77.5" height="47.5" rx="2.5" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.7"/>
  <line x1="41" y1="115.75" x2="116.5" y2="115.75" stroke="#E2C687" stroke-width="1"/>
  <line x1="41" y1="131.5" x2="116.5" y2="131.5" stroke="#E2C687" stroke-width="1"/>
  <circle cx="78.75" cy="108" r="1.5" fill="none" stroke="#E2C687" stroke-width="1"/>
  <circle cx="78.75" cy="123.75" r="1.5" fill="none" stroke="#E2C687" stroke-width="1"/>
  <rect x="66.25" y="137.75" width="25" height="3.25" rx="1.6" fill="none" stroke="#A8A29E" stroke-width="1"/>
  <path d="M49 147.5 V152.5 Q49 154 50.5 154 H56 Q57.5 154 57.5 152.5 V147.5"
        fill="none" stroke="#E2C687" stroke-width="1.7"/>
  <path d="M100 147.5 V152.5 Q100 154 101.5 154 H107 Q108.5 154 108.5 152.5 V147.5"
        fill="none" stroke="#E2C687" stroke-width="1.7"/>
  <path d="M-4.25 0 V1 Q-4.25 2.5 -2.75 2.5 H2.75 Q4.25 2.5 4.25 1 V0"
        fill="none" stroke="#E2C687" stroke-width="1.7" transform="translate(151.5 130.5) skewY(-26.57)"/>

  <!-- Bee (decorative) -->
  <g transform="translate(14 78) rotate(-14)">
    <ellipse cx="0" cy="0" rx="6.5" ry="4.25" fill="none" stroke="#D4A028" stroke-width="1.5"/>
    <line x1="-2" y1="-4" x2="-2" y2="4" stroke="#D4A028" stroke-width="1.2"/>
    <line x1="1.5" y1="-4.25" x2="1.5" y2="4.25" stroke="#D4A028" stroke-width="1.2"/>
    <ellipse cx="-1.5" cy="-6.25" rx="3.5" ry="2" fill="none" stroke="#A8A29E" stroke-width="1.2"
             transform="rotate(-18 -1.5 -6.25)"/>
    <ellipse cx="3" cy="-6" rx="3.5" ry="2" fill="none" stroke="#A8A29E" stroke-width="1.2"
             transform="rotate(14 3 -6)"/>
    <path d="M6.5 -1 q3 0 4 -2 M6.5 1 q3 0.5 3.75 2" fill="none" stroke="#D4A028" stroke-width="1"/>
  </g>

  <!-- Step 1: Scale QR scan - close-up of the Apisense Scale (two angle profiles with a gap,
       electronics box with the QR label at one end) scanned by the Apisense app. -->
  <g class="scale-scene" stroke-linecap="round" stroke-linejoin="round">
    <text x="45" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="8" font-weight="600" fill="#77777C">Scale</text>
    <line x1="45" y1="28.5" x2="45" y2="32" stroke="#A8A29E" stroke-width="0.8" stroke-dasharray="1 2.5"/>
    <g stroke="#77777C">
      <rect x="22" y="33" width="56" height="10" rx="1.5" fill="#FFFFFF" stroke-width="1.2"/>
      <rect x="36" y="44.8" width="10" height="2.8" fill="#FFFFFF" stroke-width="0.8"/>
      <rect x="56" y="44.8" width="10" height="2.8" fill="#FFFFFF" stroke-width="0.8"/>
      <rect x="20" y="48.5" width="60" height="6" rx="1" fill="#FFFFFF" stroke-width="1.2"/>
      <rect x="78" y="30.5" width="14" height="26" rx="2" fill="#FFFFFF" stroke-width="1.2"/>
    </g>
    <rect x="80" y="37" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#77777C" stroke-width="0.8"/>
    <g fill="#77777C" stroke="none">
      <rect x="81.3" y="38.3" width="2.8" height="2.8" rx="0.4"/>
      <rect x="86.2" y="38.3" width="2.8" height="2.8" rx="0.4"/>
      <rect x="81.3" y="43.2" width="2.8" height="2.8" rx="0.4"/>
      <rect x="86.2" y="43.2" width="1.5" height="1.5"/>
      <rect x="88" y="44.9" width="1.5" height="1.5"/>
    </g>
    <line x1="94" y1="42.5" x2="91" y2="42" stroke="#A8A29E" stroke-width="0.8" stroke-dasharray="1 2.5"/>
    <g class="scale-phone">
      <rect x="95" y="14" width="30" height="56" rx="4.5" fill="#FFFFFF" stroke="#77777C" stroke-width="1.2"/>
      <rect x="97.5" y="18" width="25" height="46" rx="2" fill="none" stroke="#77777C" stroke-width="0.8"/>
      <rect x="106" y="15.5" width="8" height="1.2" rx="0.6" fill="#77777C" stroke="none"/>
      <g stroke="#D4A028" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M101.5 30 V27 H104.5"/>
        <path d="M115.5 27 H118.5 V30"/>
        <path d="M118.5 48 V51 H115.5"/>
        <path d="M104.5 51 H101.5 V48"/>
      </g>
      <rect x="104.5" y="33.5" width="11" height="11" rx="1" fill="none" stroke="#77777C" stroke-width="0.8"/>
      <g fill="#77777C" stroke="none">
        <rect x="106" y="35" width="2.5" height="2.5"/>
        <rect x="111.5" y="35" width="2.5" height="2.5"/>
        <rect x="106" y="40.5" width="2.5" height="2.5"/>
        <rect x="111.8" y="40.8" width="1.6" height="1.6"/>
      </g>
      <g class="scale-scan-line">
        <rect x="100.5" y="28" width="19" height="1.2" rx="0.6" fill="#D4A028" stroke="none"/>
      </g>
      <g class="scale-scan-ok">
        <circle cx="110" cy="57.5" r="3.6" fill="#FFFFFF" stroke="#D4A028" stroke-width="1"/>
        <path d="M108.3 57.5 L109.6 59 L112 55.9" fill="none" stroke="#D4A028" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Confirmation check (pops once the scale and the beam are in place) -->
  <g class="check">
    <circle cx="55" cy="24" r="6.5" fill="#FFFFFF" stroke="#D4A028" stroke-width="1.5"/>
    <path d="M52 24 L54.3 26.5 L58.5 21" fill="none" stroke="#D4A028" stroke-width="1.5"/>
  </g>
</svg>
