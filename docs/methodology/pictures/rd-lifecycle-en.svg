<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 904" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="From idea to deployment"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB300"/><stop offset="1" stop-color="#FF8F00"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FB8C00"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E07B00"/></marker></defs><text x="410.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#3E2C0B">From idea to deployment</text><rect x="96" y="64" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="126.0" r="22" fill="url(#g)"/><text x="136" y="133.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="174" y="94" font-size="17" font-weight="700" fill="#3E2C0B">Idea &amp; concept</text><text x="174" y="116" font-size="14" fill="#5B5446">Talks with beekeepers, a review of literature and news — we</text><text x="174" y="136" font-size="14" fill="#5B5446">decide what is worth monitoring and what can be sensed from</text><text x="174" y="156" font-size="14" fill="#5B5446">hive air.</text><line x1="376.0" y1="194" x2="376.0" y2="226" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="234" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="296.0" r="22" fill="url(#g)"/><text x="136" y="303.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="174" y="264" font-size="17" font-weight="700" fill="#3E2C0B">Laboratory phase</text><text x="174" y="286" font-size="14" fill="#5B5446">Bees in cages with sensors: infected and control groups. We</text><text x="174" y="306" font-size="14" fill="#5B5446">link sensor readings with lab test results and build the first</text><text x="174" y="326" font-size="14" fill="#5B5446">models.</text><line x1="376.0" y1="364" x2="376.0" y2="396" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="404" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="466.0" r="22" fill="url(#g)"/><text x="136" y="473.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="174" y="434" font-size="17" font-weight="700" fill="#3E2C0B">Experimental apiaries</text><text x="174" y="456" font-size="14" fill="#5B5446">Promising models are tested at a larger scale, in near-real</text><text x="174" y="476" font-size="14" fill="#5B5446">conditions, cared for by scientist-beekeepers. The models keep</text><text x="174" y="496" font-size="14" fill="#5B5446">learning.</text><line x1="376.0" y1="534" x2="376.0" y2="566" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="574" width="560" height="104" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="626.0" r="22" fill="url(#g)"/><text x="136" y="633.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="174" y="604" font-size="17" font-weight="700" fill="#3E2C0B">Deployment</text><text x="174" y="626" font-size="14" fill="#5B5446">A reliable model is released globally. App data — notes and</text><text x="174" y="646" font-size="14" fill="#5B5446">test results — continuously re-trains the models.</text><path d="M 656 626.0 H 712 V 296.0 H 658" fill="none" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="2 0" marker-end="url(#arrL)"/><text x="728" y="461.0" font-size="13" font-style="italic" fill="#E07B00" text-anchor="middle" transform="rotate(90 728 461.0)">continuous re-training on new data</text><rect x="96" y="730" width="560" height="150" rx="12" fill="#FFF8E1" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="7 5"/><text x="120" y="758" font-size="15" font-weight="700" fill="#FF8F00">Exception: American foulbrood</text><text x="120" y="780" font-size="14" fill="#5B5446">Foulbrood is a notifiable disease — we never induce it in apiaries.</text><text x="120" y="800" font-size="14" fill="#5B5446">The data comes from befriended vets and beekeepers who installed our</text><text x="120" y="820" font-size="14" fill="#5B5446">sensors when they suspected the disease. We collected it while</text><text x="120" y="840" font-size="14" fill="#5B5446">awaiting laboratory confirmation, and once confirmed the equipment was</text><text x="120" y="860" font-size="14" fill="#5B5446">disposed of.</text></svg>