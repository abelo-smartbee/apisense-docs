<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 904" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Od pomysłu do wdrożenia"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB300"/><stop offset="1" stop-color="#FF8F00"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FB8C00"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E07B00"/></marker></defs><text x="410.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#3E2C0B">Od pomysłu do wdrożenia</text><rect x="96" y="64" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="126.0" r="22" fill="url(#g)"/><text x="136" y="133.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="174" y="94" font-size="17" font-weight="700" fill="#3E2C0B">Pomysł i koncepcja</text><text x="174" y="116" font-size="14" fill="#5B5446">Rozmowy z pszczelarzami, przegląd literatury i nowinek —</text><text x="174" y="136" font-size="14" fill="#5B5446">wybieramy, co warto monitorować i co da się wykryć z powietrza</text><text x="174" y="156" font-size="14" fill="#5B5446">ula.</text><line x1="376.0" y1="194" x2="376.0" y2="226" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="234" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="296.0" r="22" fill="url(#g)"/><text x="136" y="303.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="174" y="264" font-size="17" font-weight="700" fill="#3E2C0B">Faza laboratoryjna</text><text x="174" y="286" font-size="14" fill="#5B5446">Pszczoły w klateczkach z czujnikami: grupy zarażone i</text><text x="174" y="306" font-size="14" fill="#5B5446">kontrolne. Łączymy odczyty czujników z wynikami badań i</text><text x="174" y="326" font-size="14" fill="#5B5446">budujemy pierwsze modele.</text><line x1="376.0" y1="364" x2="376.0" y2="396" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="404" width="560" height="124" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="466.0" r="22" fill="url(#g)"/><text x="136" y="473.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="174" y="434" font-size="17" font-weight="700" fill="#3E2C0B">Pasieki eksperymentalne</text><text x="174" y="456" font-size="14" fill="#5B5446">Obiecujące modele sprawdzamy na większą skalę, w realnych</text><text x="174" y="476" font-size="14" fill="#5B5446">warunkach, pod opieką pszczelarzy-naukowców. Modele uczą się</text><text x="174" y="496" font-size="14" fill="#5B5446">dalej.</text><line x1="376.0" y1="534" x2="376.0" y2="566" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#arr)"/><rect x="96" y="574" width="560" height="104" rx="14" fill="#ffffff" stroke="#F0CB7A" stroke-width="1.5"/><circle cx="136" cy="626.0" r="22" fill="url(#g)"/><text x="136" y="633.0" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4</text><text x="174" y="604" font-size="17" font-weight="700" fill="#3E2C0B">Wdrożenie</text><text x="174" y="626" font-size="14" fill="#5B5446">Skuteczny model udostępniamy globalnie. Dane z aplikacji —</text><text x="174" y="646" font-size="14" fill="#5B5446">notatki i wyniki badań — nieustannie douczają modele.</text><path d="M 656 626.0 H 712 V 296.0 H 658" fill="none" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="2 0" marker-end="url(#arrL)"/><text x="728" y="461.0" font-size="13" font-style="italic" fill="#E07B00" text-anchor="middle" transform="rotate(90 728 461.0)">ciągły re-trening na nowych danych</text><rect x="96" y="730" width="560" height="150" rx="12" fill="#FFF8E1" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="7 5"/><text x="120" y="758" font-size="15" font-weight="700" fill="#FF8F00">Wyjątek: zgnilec amerykański</text><text x="120" y="780" font-size="14" fill="#5B5446">Zgnilec to choroba zwalczana z urzędu — nie wywołujemy jej w</text><text x="120" y="800" font-size="14" fill="#5B5446">pasiekach. Dane pochodzą od zaprzyjaźnionych weterynarzy i</text><text x="120" y="820" font-size="14" fill="#5B5446">pszczelarzy, którzy zakładali nasze czujniki przy podejrzeniu choroby.</text><text x="120" y="840" font-size="14" fill="#5B5446">Zbieraliśmy je do czasu potwierdzenia w laboratorium, a po</text><text x="120" y="860" font-size="14" fill="#5B5446">potwierdzeniu sprzęt był utylizowany.</text></svg>