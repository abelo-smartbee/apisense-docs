  <path d="M-4.25 0 V5 Q-4.25 6.5 -2.75 6.5 H2.75 Q4.25 6.5 4.25 5 V0"
        fill="none" stroke="#E2C687" stroke-width="1.7" transform="translate(151.5 130.5) skewY(-26.57)"/>

  <!-- Bee (decorative) -->
  <g transform="translate(30 37.5) rotate(-14)">
    <ellipse cx="0" cy="0" rx="6.5" ry="4.25" fill="none" stroke="#D4A028" stroke-width="1.5"/>
    <line x1="-2" y1="-4" x2="-2" y2="4" stroke="#D4A028" stroke-width="1.2"/>
