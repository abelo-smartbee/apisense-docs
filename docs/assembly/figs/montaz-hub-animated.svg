<!--
  ANIMATED Hub mounting instruction (browser-only preview / design source).
  Scenario: 1) the user scans the HUB's QR code with the Apisense app (close-up scene),
  2) the hub appears on a mast next to the hive, 1-2 m above the ground (ball-head clamp) - square PV panel tilted slightly toward the sun, both antennas vertical up,
  3) confirmation check. All frames stay seated in the hive - nothing else moves.

  DO NOT bundle as a Flutter asset: flutter_svg throws on style elements and supports no
  CSS/SMIL animation. Base scene: hive_frames_illustration_animated.svg. Siblings:
  montaz-systemu-animated.svg (full system), montaz-sensora-animated.svg (sensor only).

  Timing (12s loop): 6-50% QR scan (sweep 12-28%, phone check 30-34%), 56-62% hub appears,
  68-88% confirmation check, 90-100% fade for a clean wrap.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 165" stroke-linecap="round" stroke-linejoin="round">
  <title>Montaż Huba Apisense: skan QR aplikacją, montaż na prawej ściance ula, panel PV do słońca</title>
  <style>
    /* 12s LOOP: hub QR scan (close-up + phone), then the hub appears mounted on the right
       wall of the hive and a confirmation check pops. Frames never move. */
    .hub-scene { animation: hubScene 12s ease-in-out infinite; }
    @keyframes hubScene {
      0%, 2%    { opacity: 0; }
      6%, 50%   { opacity: 1; }
      56%, 100% { opacity: 0; }
    }
    .hub-phone { animation: hubPhoneIn 12s ease-in-out infinite; }
    @keyframes hubPhoneIn {
      0%, 4%    { transform: translateX(14px); opacity: 0; }
      10%, 100% { transform: translateX(0); opacity: 1; }
    }
    .hub-scan-line { animation: hubScanSweep 12s ease-in-out infinite; }
    @keyframes hubScanSweep {
      0%, 12%   { transform: translateY(0); }
      16%       { transform: translateY(22px); }
      20%       { transform: translateY(0); }
      24%       { transform: translateY(22px); }
      28%, 100% { transform: translateY(0); }
    }
    .hub-scan-ok { transform-box: fill-box; transform-origin: center;
                   animation: hubScanOk 12s ease-in-out infinite; }
    @keyframes hubScanOk {
      0%, 30%   { transform: scale(0.4); opacity: 0; }
      34%, 100% { transform: scale(1); opacity: 1; }
    }
    .hub-placed { animation: hubPlaced 12s ease-in-out infinite; }
    @keyframes hubPlaced {
      0%, 56%   { transform: translateX(8px); opacity: 0; }
      62%, 90%  { transform: translateX(0); opacity: 1; }
      96%, 100% { transform: translateX(0); opacity: 0; }
    }
    .check { transform-box: fill-box; transform-origin: center;
             animation: pop 12s ease-in-out infinite; }
    @keyframes pop {
      0%, 64%   { transform: scale(0.4); opacity: 0; }
      68%, 88%  { transform: scale(1); opacity: 1; }
      94%, 100% { transform: scale(1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hub-scene, .hub-phone, .hub-scan-line, .hub-scan-ok, .hub-placed, .check { animation: none; }
      .hub-scene { opacity: 0; }
      .check { opacity: 1; }
    }
  </style>

  <!-- Top opening + slot guide lines (under the frames) -->
  <path d="M48.9 98.3 L115.4 98.3 L151.1 80.45 L84.6 80.45 Z" fill="#F1E6CC" stroke="#E2C687" stroke-width="1.2"/>
  <line x1="52.25" y1="96.6" x2="118.75" y2="96.6" stroke="#E2C687" stroke-width="1"/>
  <line x1="66.75" y1="89.38" x2="133.25" y2="89.38" stroke="#E2C687" stroke-width="1"/>
  <line x1="81.25" y1="82.15" x2="147.75" y2="82.15" stroke="#E2C687" stroke-width="1"/>
  <line x1="59.5" y1="92.99" x2="126" y2="92.99" stroke="#E2C687" stroke-width="1"/>
  <line x1="74" y1="85.76" x2="140.5" y2="85.76" stroke="#E2C687" stroke-width="1"/>

  <!-- Rim parts BEHIND all frames: left rail, back band, far end of the right rail -->
  <path d="M40 100 L48.9 98.3 L84.6 80.45 L82.5 78.75 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>
  <path d="M82.5 78.75 L84.6 80.45 L151.1 80.45 L160 78.75 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>
  <path d="M145 83.5 L145 86.25 L160 78.75 L151.1 80.45 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Back frame (gray, outer) -->
  <g transform="translate(0 33)" stroke="#A8A29E">
    <path d="M145.75 46 L149.75 44 L149.75 50 L145.75 52 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M83.25 46 L87.25 44 L149.75 44" fill="none" stroke-width="1.2"/>
    <rect x="78.25" y="48" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="145.75" y="47" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="83.25" y="46" width="62.5" height="36.5" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="87.25" y="50" width="54.5" height="28.5" rx="1.25" fill="none" stroke-width="1"/>
    <g stroke-width="1" fill="none">
      <path transform="translate(106.5 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(113.75 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(121 58)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(110 64.75)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(117.25 64.75)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
    </g>
  </g>

