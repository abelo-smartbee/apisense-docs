  <!-- Step 0a: hub QR scan - close-up of the Apisense Hub (PV panel on a pole, two antennas)
       with its QR label, scanned by the Apisense app. Fades out, then the placed hub appears. -->
  <g class="hub-scene" stroke-linecap="round" stroke-linejoin="round">
