  </g>

  <!-- Right rail in front of the back-mid slot (over back-mid, under central) -->
  <path d="M130.75 90.625 L130.75 93.375 L138 89.75 L138 87 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Central frame (honey, tallest - the visual focus) -->
  <g transform="translate(0 49.5)" stroke="#D4A028">
    <path d="M131.25 36.75 L135.25 34.75 L135.25 40.75 L131.25 42.75 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M68.75 36.75 L72.75 34.75 L135.25 34.75" fill="none" stroke-width="1.2"/>
    <rect x="63.75" y="38.75" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="131.25" y="37.75" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="68.75" y="36.75" width="62.5" height="53" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
