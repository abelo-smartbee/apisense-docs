  <!-- Step 0b: hub on a mast next to the hive, 1-2 m above the ground (ball-head photographic
       clamp on top; height dimension drawn) - square PV panel tilted slightly toward the sun,
       both antennas vertical. Stays for the rest of the loop. Antenna tops
       kept below y=80: the sensor slide-in corridor (y 34-78) must stay clear. -->
  <g class="hub-placed" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#77777C">
      <!-- mast next to the hive: the hub sits 1-2 m above the ground (per the manual);
           ball head on top of the mast = photographic clamp -->
      <rect x="197.2" y="74.5" width="2.8" height="76" rx="1" fill="#FFFFFF" stroke-width="1"/>
