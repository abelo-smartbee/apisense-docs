    <g stroke-width="1" fill="none">
      <path transform="translate(83 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(91.75 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(100.5 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
      <path transform="translate(109.25 46.5)" d="M0 -5 L4.25 -2.5 L4.25 2.5 L0 5 L-4.25 2.5 L-4.25 -2.5 Z"/>
    </g>
  </g>

  <!-- Right rail in front of the central slot (over central frame, under front-mid) -->
  <path d="M123.5 94.25 L123.5 97 L130.75 93.375 L130.75 90.625 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Front filler frame - stays seated in its slot (only outer + central slide out) -->
  <g transform="translate(0 36.9)" stroke="#E2C687">
    <path d="M124.0 53 L128.0 51 L128.0 57 L124.0 59 Z" fill="#FFFFFF" stroke-width="1.2"/>
    <path d="M61.5 53 L65.5 51 L128.0 51" fill="none" stroke-width="1.2"/>
    <rect x="56.5" y="55" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="124.0" y="54" width="5" height="3.5" rx="1.25" fill="#FFFFFF" stroke-width="1.2"/>
    <rect x="61.5" y="53" width="62.5" height="40.4" rx="2" fill="#FFFFFF" stroke-width="1.7"/>
    <rect x="65.5" y="57" width="54.5" height="32.4" rx="1.25" fill="none" stroke-width="1"/>
  </g>

  <!-- Right rail in front of the front-mid slot (over front-mid, under front) -->
  <path d="M115.4 98.3 L117.5 100 L123.5 97 L123.5 94.25 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

