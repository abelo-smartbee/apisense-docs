  <circle cx="78.75" cy="108" r="1.5" fill="none" stroke="#E2C687" stroke-width="1"/>
  <circle cx="78.75" cy="123.75" r="1.5" fill="none" stroke="#E2C687" stroke-width="1"/>
  <rect x="66.25" y="137.75" width="25" height="3.25" rx="1.6" fill="none" stroke="#A8A29E" stroke-width="1"/>
  <path d="M49 147.5 V152.5 Q49 154 50.5 154 H56 Q57.5 154 57.5 152.5 V147.5"
