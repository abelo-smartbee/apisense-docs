      <path transform="translate(92 72.5)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(81 79.25)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
      <path transform="translate(88.25 79.25)" d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z"/>
    </g>
  </g>

  <!-- Front band of the rim (over ALL frames - they retract behind it) -->
  <path d="M40 100 L117.5 100 L115.4 98.3 L48.9 98.3 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.5"/>

  <!-- Hive body -->
  <path d="M117.5 100 L160 78.75 L160 126.25 L117.5 147.5 Z" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.7"/>
  <line x1="117.5" y1="115.75" x2="160" y2="94.5" stroke="#E2C687" stroke-width="1"/>
  <line x1="117.5" y1="131.5" x2="160" y2="110.25" stroke="#E2C687" stroke-width="1"/>
  <rect x="40" y="100" width="77.5" height="47.5" rx="2.5" fill="#FFFFFF" stroke="#E2C687" stroke-width="1.7"/>
