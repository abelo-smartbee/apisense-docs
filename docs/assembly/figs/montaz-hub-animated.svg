    <text x="170" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="5.5" font-weight="600" fill="#77777C">1–2 m</text>
    <g>
    </g>
  </g>

  <!-- Confirmation check (pops once the hub is mounted) -->
