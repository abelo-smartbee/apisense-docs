    </g>
    <!-- height dimension: 1-2 m from the ground to the hub -->
    <g stroke="#A8A29E" stroke-width="0.8" fill="none">
      <path d="M170 76 V108 M170 124 V149 M168.5 78.5 L170 76 L171.5 78.5 M168.5 146.5 L170 149 L171.5 146.5"/>
